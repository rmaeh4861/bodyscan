<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모닝루틴 · 1분 체형 분석</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#000;--card:#0f0f11;--card2:#151517;--line:#26262a;--line2:#3a3a40;
    --tx:#fff;--tx2:#a1a1aa;--tx3:#6b6b73;--tx4:#45454c;}
  html,body{background:#000;color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .screen{flex:1;display:none;flex-direction:column;animation:fade .35s ease;}
  .screen.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .pad{padding:28px 22px;}

  .prog{padding:20px 22px 0;}
  .prog-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.5px;color:var(--tx3);margin-bottom:12px;}
  .prog-row b{color:var(--tx);font-weight:600;}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--tx);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0;}

  .intro{justify-content:space-between;}
  .intro-top{font-size:12px;letter-spacing:1px;color:var(--tx3);}
  .intro-mid h1{font-size:34px;font-weight:600;line-height:1.42;letter-spacing:-.5px;}
  .intro-mid p{margin-top:16px;font-size:15px;line-height:1.7;color:var(--tx2);}
  .intro-note{font-size:12.5px;color:var(--tx3);margin-top:22px;line-height:1.6;}

  h2.q{font-size:22px;font-weight:600;line-height:1.45;letter-spacing:-.3px;}
  .q-sub{margin-top:10px;font-size:14px;line-height:1.65;color:var(--tx2);}
  .q-eyebrow{font-size:12px;letter-spacing:.5px;color:var(--tx3);margin-bottom:14px;}

  .opts{margin-top:26px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .opt{width:100%;text-align:left;background:var(--card);color:var(--tx);border:.5px solid var(--line);border-radius:15px;padding:17px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;}
  .opt:active{background:var(--card2);}
  .opt.sel{background:#fff;color:#000;border-color:#fff;}
  .opt .chk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opt.sel .chk{border-color:#000;background:#000;}
  .opt.sel .chk::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;}

  .nav{display:flex;gap:10px;margin-top:18px;}
  .btn{border:none;border-radius:15px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-ghost{background:transparent;border:.5px solid var(--line);color:var(--tx2);padding:16px 22px;}
  .btn-primary{flex:1;background:#fff;color:#000;padding:16px;}
  .btn-primary:disabled{background:#1c1c20;color:#45454c;}
  .btn-full{width:100%;background:#fff;color:#000;padding:17px;border-radius:999px;font-size:15px;font-weight:600;border:none;cursor:pointer;}
  .btn-full:active{background:#dedede;}

  .load{align-items:center;justify-content:center;text-align:center;}
  .spin{width:38px;height:38px;border:2px solid var(--line);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load h3{margin-top:22px;font-size:16px;font-weight:600;}
  .load p{margin-top:7px;font-size:13.5px;color:var(--tx3);}

  .r-scroll{overflow-y:auto;}
  .r-head{font-size:25px;font-weight:600;line-height:1.4;letter-spacing:-.3px;}
  .r-sub{margin-top:10px;font-size:14px;color:var(--tx2);line-height:1.6;}

  .bm-wrap{margin-top:20px;border:.5px solid var(--line);background:#08080a;border-radius:18px;overflow:hidden;}
  .bm-tabs{display:flex;}
  .bm-tab{flex:1;text-align:center;padding:13px;font-size:13px;color:var(--tx3);background:transparent;border:none;cursor:pointer;border-bottom:1.5px solid transparent;}
  .bm-tab.on{color:#fff;border-bottom-color:#fff;}
  .bm-stage{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;padding:6%;}
  .bm-fig{height:100%;width:auto;}
  .bm-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--tx4);}

  .lbl{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:#000;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(255,255,255,.13);z-index:2;}
  .lbl::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,255,255,.2);animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.75);opacity:.85;}100%{transform:scale(1.45);opacity:0;}}

  .sec-t{font-size:15px;font-weight:600;margin:26px 0 12px;}
  .dcard{border:.5px solid var(--line);background:var(--card);border-radius:16px;padding:18px 17px;margin-bottom:11px;}
  .dtop{display:flex;align-items:center;gap:10px;}
  .dbadge{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dpart{font-size:11.5px;color:var(--tx3);letter-spacing:.3px;}
  .dtitle{font-size:15.5px;font-weight:600;line-height:1.4;margin-top:2px;}
  .dbody{font-size:13.5px;line-height:1.85;color:#c7c7cd;margin-top:12px;}
  .dbody+.dbody{margin-top:9px;}
  .dnote{font-size:12.5px;line-height:1.75;color:var(--tx3);margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);}

  .rout{display:flex;flex-direction:column;gap:11px;}
  .rcard{border:.5px solid var(--line);background:var(--card);border-radius:15px;overflow:hidden;}
  .rthumb{aspect-ratio:3/4;max-height:70vh;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .rthumb video{width:100%;height:100%;object-fit:cover;object-position:center top;background:#000;}
  .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .play::after{content:"";border-left:13px solid #000;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px;}
  .rthumb .soon{position:absolute;bottom:10px;font-size:11px;color:var(--tx3);}
  .rthumb.has-video .play{position:absolute;transition:opacity .2s;}
  .rthumb.playing .play{opacity:0;pointer-events:none;}
  .rbody{padding:14px 15px;}
  .rbody .t{font-size:14.5px;font-weight:600;}
  .rbody .sub{font-size:12px;color:var(--tx2);margin-top:2px;}
  .rbody .d{font-size:12.5px;color:var(--tx3);margin-top:7px;line-height:1.6;}

  .cta-wrap{margin-top:28px;}
  .cta-note{text-align:center;font-size:12.5px;color:var(--tx3);margin-top:11px;}
  .restart{width:100%;background:transparent;border:none;color:var(--tx4);font-size:13px;margin-top:18px;cursor:pointer;}
  .disc{text-align:center;font-size:11px;line-height:1.7;color:#3a3a40;margin-top:16px;padding-bottom:10px;}
  .feedback{margin:14px 22px 24px;border:.5px dashed var(--line2);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--tx2);line-height:1.6;}
  .feedback b{color:#fff;}
</style>
</head>
<body>
<div class="phone">

  <div class="prog" id="prog" style="display:none;">
    <div class="prog-row"><span id="progLabel">SCAN 1</span><b id="progPct">0%</b></div>
    <div class="bar"><i id="progFill"></i></div>
  </div>

  <section class="screen active intro pad" id="s-intro">
    <div class="intro-top">모닝루틴 · 금선생</div>
    <div class="intro-mid">
      <h1>1분,<br>집에서 하는<br>체형 분석 테스트</h1>
      <p>불편한 곳을 고르면, 몇 가지 자가 체크로<br>지금 내 몸의 패턴을 짚어드려요.</p>
      <div class="intro-note">물리치료사가 설계한 자가 체크입니다.</div>
    </div>
    <button class="btn-full" onclick="startScan()">스캔 시작하기</button>
  </section>

  <section class="screen pad" id="s-quiz">
    <div id="quizArea" style="flex:1;display:flex;flex-direction:column;"></div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="prevStep()">이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">다음</button>
    </div>
  </section>

  <section class="screen load pad" id="s-load">
    <div class="spin"></div>
    <h3>결과를 분석하고 있어요</h3>
    <p>잠시만 기다려주세요</p>
  </section>

  <section class="screen r-scroll pad" id="s-result"></section>

  <div class="feedback" id="fbStrip" style="display:none;">
    <b>테스트 버전이에요.</b> 써보시고 어색한 문구·흐름·디자인 있으면 편하게 알려주세요 🙏
  </div>
</div>

<script>
/* ================= 부위 ================= */
const PARTS=[
  {id:'neck',label:'목 · 어깨'},{id:'back',label:'등 · 허리'},{id:'pelvis',label:'골반 · 고관절'},
  {id:'knee',label:'무릎'},{id:'wrist',label:'손목 · 팔꿈치'},{id:'ankle',label:'발목 · 발'},
];

/* ================= 문진 ================= */
const DIFF={
  neck:[
    {q:'팔로 저림이 내려가면서, 엄지·검지·중지 같은 특정 손가락 쪽으로 저린가요?',sub:'신경 흐름과 관련된 부분을 먼저 확인할게요.',
     opts:[{t:'네, 특정 손가락으로 저려요',tag:'neck_nerve'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'고개를 오래 숙이거나 화면을 볼 때 목뒤·어깨가 뻐근한가요?',opts:[{t:'네',tag:'forwardhead'},{t:'아니요',tag:''}]},
    {q:'힘을 빼고 편하게 섰을 때, 손등이 앞(정면)을 향하나요?',opts:[{t:'네, 앞을 향해요',tag:'roundshoulder'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'팔로 벽을 밀 때 한쪽 날개뼈가 유독 튀어나오나요?',opts:[{t:'네',tag:'winging'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
  ],

     opts:[{t:'네, 무릎 아래까지요',tag:'back_nerve'},{t:'무릎 위까지만요',tag:''},{t:'저림은 없어요',tag:''}]},
    {q:'앞으로 숙일 때와 뒤로 젖힐 때, 어느 쪽이 더 불편한가요?',opts:[{t:'앞으로 숙일 때',tag:'flexion'},{t:'뒤로 젖힐 때',tag:'extension'},{t:'비슷해요',tag:''}]},
    {q:'오래 앉아 있다가 일어설 때 허리가 유독 뻣뻣한가요?',opts:[{t:'네',tag:'sitstiff'},{t:'아니요',tag:''}]},
    {q:'옆구리 한쪽만 뭉치거나 짧은 느낌이 있나요?',opts:[{t:'네',tag:'ql'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
  ],
  pelvis:[
    {q:'누워서 양발을 폈을 때, 한쪽 다리가 더 길어 보이나요?',opts:[{t:'네, 한쪽이 길어요',tag:'pelvistilt'},{t:'비슷해요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'통증이 허리보다 엉덩이 깊은 곳에 있고, 오래 앉으면 심해지나요?',opts:[{t:'네',tag:'piriformis'},{t:'아니요',tag:''}]},
    {q:'4자로 다리를 꼬고 무릎을 바깥으로 눌렀을 때 한쪽만 뻣뻣한가요?',opts:[{t:'네',tag:'piriformis'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'짝다리·다리 꼬기 등 한쪽으로 몰리는 습관이 있나요?',opts:[{t:'네',tag:'habit'},{t:'아니요',tag:''}]},
  ],
  knee:[
    {q:'계단을 내려갈 때나 쪼그려 앉을 때 무릎 앞쪽이 아픈가요?',opts:[{t:'네',tag:'pfp'},{t:'아니요',tag:''}]},
    {q:'무릎 안쪽이 특히 아프고, 오래 걸으면 심해지나요?',opts:[{t:'네',tag:'medial'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'무릎이 붓거나, 꺾이는 느낌(불안정)이 있나요?',sub:'상태 변화를 함께 살펴볼게요.',opts:[{t:'네',tag:'knee_check'},{t:'아니요',tag:''}]},
  ],
  wrist:[
    {q:'손 저림이 특히 엄지·검지·중지 쪽이고, 밤에 저려서 깰 때가 있나요?',sub:'신경 흐름과 관련된 부분을 먼저 확인할게요.',
     opts:[{t:'네',tag:'cts_strong'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'양손등을 맞대고 손목을 아래로 꺾어 1분 유지했을 때, 손가락에 저림·찌릿함이 생기나요?',sub:'팔렌 테스트예요. 천천히 해보세요.',
     opts:[{t:'네, 저려요',tag:'cts'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:''}]},
    {q:'물건을 쥐거나 손목을 들 때 팔꿈치 바깥쪽이 아픈가요?',opts:[{t:'네',tag:'tenniselbow'},{t:'아니요',tag:''}]},

  ankle:[

    {q:'예전에 발목을 접질린 적이 있고, 지금도 가끔 꺾이거나 불안정한가요?',opts:[{t:'네',tag:'instability'},{t:'아니요',tag:''}]},
    {q:'오래 서 있거나 걸으면 발 아치(장심)가 무겁고 피로한가요?',opts:[{t:'네',tag:'arch'},{t:'아니요',tag:''}]},
  ],

   title 원칙: 대중적 키워드 + 생체역학 표현 + "패턴"  (~염/~증후군 배제) */

/* ================= state ================= */
let steps=[],cur=0,answers={},selectedParts=[];
function buildSteps(){
  steps=[{type:'multi',key:'parts'}];
  selectedParts.forEach(pid=>{DIFF[pid].forEach((qq,qi)=>{steps.push({type:'single',key:pid+'_'+qi,part:pid,data:qq});});});
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function startScan(){
  answers={};selectedParts=[];steps=[{type:'multi',key:'parts'}];cur=0;
  document.getElementById('prog').style.display='block';
  document.getElementById('fbStrip').style.display='block';
  show('s-quiz');renderStep();
}
function updateProg(){
  const pct=Math.round(((cur+1)/steps.length)*100);
  document.getElementById('progLabel').textContent='SCAN '+(cur+1);
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progFill').style.width=pct+'%';
}
function renderStep(){
  updateProg();
  const st=steps[cur],area=document.getElementById('quizArea'),nb=document.getElementById('nextBtn');
  if(st.type==='multi'){
    nb.style.display='block';nb.textContent='다음';nb.disabled=false;
    let h=`<div class="q-eyebrow">STEP 1</div><h2 class="q">요즘 가장 불편한 곳은 어디인가요?</h2>
      <div class="q-sub">여러 개 골라도 괜찮아요.</div><div class="opts">`;
    PARTS.forEach(p=>{h+=`<button class="opt ${selectedParts.includes(p.id)?'sel':''}" onclick="togglePart('${p.id}')"><span>${p.label}</span><span class="chk"></span></button>`;});
    area.innerHTML=h+`</div>`;
  }else{
    nb.style.display='none';
    const d=st.data;
    let h=`<div class="q-eyebrow">${partLabel(st.part)}</div><h2 class="q">${d.q}</h2>`;
    if(d.sub)h+=`<div class="q-sub">${d.sub}</div>`;
    h+=`<div class="opts">`;
    d.opts.forEach((o,oi)=>{h+=`<button class="opt ${answers[st.key]===oi?'sel':''}" onclick="pickSingle(${oi},'${o.tag}')"><span>${o.t}</span></button>`;});
    area.innerHTML=h+`</div>`;
  }
}
function partLabel(pid){const p=PARTS.find(x=>x.id===pid);return p?p.label:'';}
function togglePart(pid){const i=selectedParts.indexOf(pid);if(i>=0)selectedParts.splice(i,1);else selectedParts.push(pid);renderStep();}
function pickSingle(oi,tag){const st=steps[cur];answers[st.key]=oi;answers[st.key+'_tag']=tag;renderStep();setTimeout(autoNext,180);}
function autoNext(){if(cur+1<steps.length){cur++;renderStep();}else finish();}
function nextStep(){const st=steps[cur];if(st.type==='multi'){buildSteps();if(steps.length===1){finish();return;}cur++;renderStep();}}
function prevStep(){
  if(cur===0){show('s-intro');document.getElementById('prog').style.display='none';document.getElementById('fbStrip').style.display='none';return;}
  cur--;renderStep();
}
function finish(){show('s-load');document.getElementById('prog').style.display='none';setTimeout(renderResult,1700);}

/* ================= 마커 분산 로직 =================
   동일/인접 좌표(최소 간격 MIN_DIST 미만) 발생 시 순차 오프셋 적용
   1st: 기본 / 2nd: (+4,-2) / 3rd: (-4,+2) / 4th: (+4,+2) / 5th: (-4,-2) … 반복 */
const MIN_DIST=8;
const OFFSETS=[[0,0],[4,-2],[-4,2],[4,2],[-4,-2],[0,-5],[0,5],[8,0],[-8,0]];
function resolvePositions(list){
  const placed=[];
  return list.map(p=>{
    let best=null;
    for(let i=0;i<OFFSETS.length;i++){
      const nx=p.x+OFFSETS[i][0],ny=p.y+OFFSETS[i][1];
      const ok=placed.every(q=>Math.hypot(q.x-nx,q.y-ny)>=MIN_DIST);
      if(ok){best={x:nx,y:ny};break;}
      if(i===OFFSETS.length-1)best={x:nx,y:ny};
    }
    placed.push(best);
    return {...p,px:best.x,py:best.y};
  });
}

/* ================= 결과 ================= */
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function collectTags(){const t=[];Object.keys(answers).forEach(k=>{if(k.endsWith('_tag')&&answers[k])t.push(answers[k]);});return[...new Set(t)];}
function renderResult(){
  const tags=collectTags();
  const pats=tags.map(t=>({tag:t,...PATTERN[t]})).filter(p=>p.title).map((p,i)=>({...p,ab:AZ[i]}));
  const el=document.getElementById('s-result');let h='';
  if(pats.length===0){
    h+=`<h2 class="r-head">지금은 뚜렷한 패턴이<br>보이지 않아요</h2><div class="r-sub">좋은 신호예요. 예방 차원의 스트레칭을 꾸준히 이어가면 좋습니다.</div>`;
  }else{
    h+=`<h2 class="r-head">${pats.length}가지 패턴이 보여요</h2><div class="r-sub">인체도의 표시와 아래 설명을 같은 기호로 맞춰두었어요.</div>`;
    const front=resolvePositions(pats.filter(p=>p.view==='front'));
    const back=resolvePositions(pats.filter(p=>p.view==='back'));
    h+=`<div class="bm-wrap"><div class="bm-tabs">
        <button class="bm-tab on" id="tabFront" onclick="switchTab('front')">전면</button>
        <button class="bm-tab" id="tabBack" onclick="switchTab('back')">후면</button></div>
      <div class="bm-stage" id="bmFront">${figureFront()}${labels(front)}${front.length?'':'<div class="bm-empty">전면에 표시된 항목이 없어요</div>'}</div>
      <div class="bm-stage" id="bmBack" style="display:none;">${figureBack()}${labels(back)}${back.length?'':'<div class="bm-empty">후면에 표시된 항목이 없어요</div>'}</div></div>`;
    h+=`<div class="sec-t">상세 결과</div>`;
    pats.forEach(p=>{h+=`<div class="dcard"><div class="dtop"><div class="dbadge">${p.ab}</div>
      <div><div class="dpart">${p.part}</div><div class="dtitle">${p.title}</div></div></div>
      <div class="dbody">${p.cause}</div><div class="dbody">${p.symp}</div><div class="dnote">${p.guide}</div></div>`;});
    const rkeys=[...new Set(tags.filter(t=>ROUTINE[t]))];
    if(rkeys.length){
      h+=`<div class="sec-t">오늘부터 할 스트레칭</div><div class="rout">`;
      rkeys.forEach(k=>{
        const r=ROUTINE[k];
        const src = r.video || (VIDEO_DIR + k + '.mp4');
        const thumb = `<div class="rthumb" onclick="toggleVideo(this)">
               <video src="${src}" playsinline preload="metadata"
                 onloadedmetadata="this.parentElement.classList.add('has-video')"
                 onerror="videoMissing(this)"
                 onended="this.parentElement.classList.remove('playing')"></video>
               <div class="play"></div>
             </div>`;
        h+=`<div class="rcard">${thumb}
          <div class="rbody"><div class="t">${r.t}</div><div class="sub">${r.sub}</div><div class="d">${r.d}</div></div></div>`;
      });
      h+=`</div>`;
    }
  }
  h+=`<div class="cta-wrap"><button class="btn-full" onclick="alert('실제 배포 시 인스타 DM으로 연결됩니다')">금선생에게 물어보기</button>
    <div class="cta-note">내 결과가 궁금하면 편하게 DM 주세요</div></div>
    <button class="restart" onclick="startScan()">다시 스캔하기</button>
    <div class="disc">자가 체크를 바탕으로 한 패턴 안내예요 · 의료 진단이 아닙니다</div>`;
  el.innerHTML=h;show('s-result');el.scrollTop=0;
}
function switchTab(v){
  document.getElementById('tabFront').classList.toggle('on',v==='front');
  document.getElementById('tabBack').classList.toggle('on',v==='back');
  document.getElementById('bmFront').style.display=v==='front'?'flex':'none';
  document.getElementById('bmBack').style.display=v==='back'?'flex':'none';
}
function labels(list){return list.map(p=>`<span class="lbl" style="left:${p.px}%;top:${p.py}%;">${p.ab}</span>`).join('');}

function toggleVideo(box){
  const v = box.querySelector('video');
  if(!v || !box.classList.contains('has-video')) return;
  if(v.paused){ v.play(); box.classList.add('playing'); }
  else { v.pause(); box.classList.remove('playing'); }
}
function videoMissing(v){
  const box=v.parentElement; v.remove();
  box.classList.remove('has-video');
  if(!box.querySelector('.soon')) box.insertAdjacentHTML('beforeend','<div class="soon">영상 준비 중</div>');
}
