<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모닝루틴 · 1분 체형 분석</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#000;--card:#0f0f11;--card2:#151517;--line:#26262a;--line2:#3a3a40;
    --tx:#fff;--tx2:#a1a1aa;--tx3:#6b6b73;--tx4:#45454c;}
  html,body{background:#000;color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .screen{flex:1;display:none;flex-direction:column;animation:fade .35s ease;}
  .screen.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .pad{padding:28px 22px;}

  .prog{padding:20px 22px 0;}
  .prog-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.5px;color:var(--tx3);margin-bottom:12px;}
  .prog-row b{color:var(--tx);font-weight:600;}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--tx);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0;}

  .intro{justify-content:space-between;}
  .intro-top{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.5px;color:var(--tx3);text-decoration:none;}
  .intro-top svg{flex:0 0 auto;}
  .intro-mid h1{font-size:34px;font-weight:600;line-height:1.42;letter-spacing:-.5px;}
  .intro-mid p{margin-top:16px;font-size:15px;line-height:1.7;color:var(--tx2);}
  .intro-note{font-size:12.5px;color:var(--tx3);margin-top:22px;line-height:1.6;}
  .intro-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;}
  .intro-badges span{font-size:11.5px;color:var(--tx2);border:.5px solid var(--line2);border-radius:999px;padding:5px 10px;}

  h2.q{font-size:22px;font-weight:600;line-height:1.45;letter-spacing:-.3px;}
  .q-sub{margin-top:10px;font-size:14px;line-height:1.65;color:var(--tx2);}
  .q-eyebrow{font-size:12px;letter-spacing:.5px;color:var(--tx3);margin-bottom:14px;}

  .opts{margin-top:26px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .opt{width:100%;text-align:left;background:var(--card);color:var(--tx);border:.5px solid var(--line);border-radius:15px;padding:17px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;}
  .opt:active{background:var(--card2);}
  .opt.sel{background:#fff;color:#000;border-color:#fff;}
  .opt .chk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opt.sel .chk{border-color:#000;background:#000;}
  .opt.sel .chk::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;}

  .nav{display:flex;gap:10px;margin-top:18px;}
  .btn{border:none;border-radius:15px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-ghost{background:transparent;border:.5px solid var(--line);color:var(--tx2);padding:16px 22px;}
  .btn-primary{flex:1;background:#fff;color:#000;padding:16px;}
  .btn-primary:disabled{background:#1c1c20;color:#45454c;}
  .btn-full{width:100%;background:#fff;color:#000;padding:17px;border-radius:999px;font-size:15px;font-weight:600;border:none;cursor:pointer;}
  .btn-full:active{background:#dedede;}
  .btn-full.btn-sub{margin-top:9px;background:transparent;color:var(--tx);border:.5px solid var(--line2);}

  .load{align-items:center;justify-content:center;text-align:center;}
  .spin{width:38px;height:38px;border:2px solid var(--line);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load h3{margin-top:22px;font-size:16px;font-weight:600;}
  .load p{margin-top:7px;font-size:13.5px;color:var(--tx3);}

  .r-scroll{overflow-y:auto;}
  .r-head{font-size:25px;font-weight:600;line-height:1.4;letter-spacing:-.3px;}
  .r-sub{margin-top:10px;font-size:14px;color:var(--tx2);line-height:1.6;}

  .bm-wrap{margin-top:20px;border:.5px solid var(--line);background:#08080a;border-radius:18px;overflow:hidden;}
  .bm-tabs{display:flex;}
  .bm-tab{flex:1;text-align:center;padding:13px;font-size:13px;color:var(--tx3);background:transparent;border:none;cursor:pointer;border-bottom:1.5px solid transparent;}
  .bm-tab.on{color:#fff;border-bottom-color:#fff;}
  .bm-stage{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;padding:6%;background:#000;}
  .bm-fig{height:100%;width:auto;}
  .bm-img{height:100%;width:auto;object-fit:contain;filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:screen;}
  .bm-imgwrap{height:100%;display:flex;align-items:center;justify-content:center;}
  .bm-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--tx4);}

  .lbl{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:#000;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(255,255,255,.13);z-index:2;}
  .lbl::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,255,255,.2);animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.75);opacity:.85;}100%{transform:scale(1.45);opacity:0;}}

  .sec-t{font-size:15px;font-weight:600;margin:26px 0 12px;}
  .dcard{border:.5px solid var(--line);background:var(--card);border-radius:16px;padding:18px 17px;margin-bottom:11px;}
  .dtop{display:flex;align-items:center;gap:10px;}
  .dbadge{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dpart{font-size:11.5px;color:var(--tx3);letter-spacing:.3px;}
  .dtitle{font-size:15.5px;font-weight:600;line-height:1.4;margin-top:2px;}
  .dshort{margin-top:11px;font-size:14px;line-height:1.65;color:var(--tx);}
  .dmore{display:none;}
  .dcard.open .dmore{display:block;}
  .dtoggle{margin-top:12px;background:transparent;border:none;color:var(--tx3);font-size:12.5px;cursor:pointer;padding:0;}
  .dbody{font-size:13.5px;line-height:1.85;color:#c7c7cd;margin-top:12px;}
  .dbody+.dbody{margin-top:9px;}
  .dnote{font-size:12.5px;line-height:1.75;color:var(--tx3);margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);}

  .rout{display:flex;flex-direction:column;gap:11px;}
  .rcard{border:.5px solid var(--line);background:var(--card);border-radius:15px;overflow:hidden;}
  .rthumb{aspect-ratio:4/5;max-height:70vh;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .rthumb video{width:100%;height:100%;object-fit:cover;object-position:center top;background:#000;}
  .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .play::after{content:"";border-left:13px solid #000;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px;}
  .rthumb .soon{position:absolute;bottom:10px;font-size:11px;color:var(--tx3);}
  .rthumb.has-video .play{position:absolute;transition:opacity .2s;}
  .rthumb.playing .play{opacity:0;pointer-events:none;}
  .rbody{padding:14px 15px;}
  .rtier{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--tx3);border:.5px solid var(--line2);border-radius:6px;padding:2px 7px;margin-bottom:8px;}
  .rtier.std{color:#000;background:#fff;border-color:#fff;}
  .rbody .t{font-size:14.5px;font-weight:600;}
  .rbody .t .tsub{font-size:12.5px;font-weight:400;color:var(--tx2);}
  .rbody .sub{font-size:12px;color:var(--tx2);margin-top:2px;}
  .rbody .d{font-size:12.5px;color:var(--tx3);margin-top:7px;line-height:1.6;}

  .free-end{margin-top:30px;font-size:12.5px;line-height:1.7;color:var(--tx3);}
  .prof-sec{margin-top:16px;padding-top:24px;border-top:.5px solid var(--line);}
  .prof-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
  .prof-tag{font-size:10px;font-weight:700;letter-spacing:1px;color:#000;background:#fff;border-radius:5px;padding:3px 8px;}
  .prof-t{font-size:15px;font-weight:600;}
  .prof-one{border:.5px solid var(--line2);background:var(--card);border-radius:16px;padding:18px 17px;cursor:pointer;}
  .prof-one:active{background:var(--card2);}
  .prof-one-t{font-size:16px;font-weight:600;}
  .prof-one-d{margin-top:9px;font-size:13.5px;line-height:1.75;color:var(--tx2);}
  .prof-one-d b{color:var(--tx);font-weight:600;}
  .prof-list{margin:13px 0 0;padding-left:17px;}
  .prof-list li{font-size:13px;line-height:1.95;color:var(--tx2);}
  .prof-list b{color:var(--tx);font-weight:600;}
  .prof-one-c{margin-top:14px;font-size:12.5px;color:var(--tx3);}
  .prof-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .prof-card{position:relative;border:.5px solid var(--line2);background:var(--card);border-radius:14px;
    padding:20px 12px;text-align:center;cursor:pointer;overflow:hidden;transition:.15s;}
  .prof-card:active{background:var(--card2);}
  .prof-lock{font-size:19px;opacity:.85;}
  .prof-nm{margin-top:8px;font-size:12.5px;font-weight:500;color:var(--tx2);filter:blur(.4px);}
  .prof-note{margin-top:12px;font-size:12px;line-height:1.7;color:var(--tx3);}
  .cta-wrap{margin-top:28px;}
  .side-line{margin-top:12px;font-size:12.5px;color:var(--tx3);}
  .unsure-note{margin-top:26px;border:.5px dashed var(--line2);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.65;color:var(--tx2);}
  .cta-note{text-align:center;font-size:12.5px;color:var(--tx3);margin-top:11px;}
  .restart{width:100%;background:transparent;border:none;color:var(--tx4);font-size:13px;margin-top:18px;cursor:pointer;}
  .disc{text-align:center;font-size:11px;line-height:1.7;color:#3a3a40;margin-top:16px;padding-bottom:10px;}
  .feedback{margin:14px 22px 24px;border:.5px dashed var(--line2);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--tx2);line-height:1.6;}
  .feedback b{color:#fff;}
  /* 연결 카드 · 주의 신호 · 전문가 평가 연결 */
  .combo{margin-top:18px;border:.5px solid var(--line2);background:var(--card2);border-radius:16px;padding:16px 17px;}
  .combo-eb{font-size:12px;color:var(--tx3);margin-bottom:8px;}
  .combo-t{font-size:14.5px;font-weight:600;margin-bottom:8px;}
  .rv-wrap{overflow:hidden;margin:0 0 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}
  .rv-track{display:flex;gap:10px;width:max-content;animation:rvscroll 34s linear infinite;}
  .rv{flex:0 0 auto;border:.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--tx2);line-height:1.5;}
  .rv b{display:block;color:var(--tx);font-weight:500;margin-bottom:3px;}
  .rv .st{letter-spacing:1px;font-size:11px;color:var(--tx3);}
  @keyframes rvscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion:reduce){.rv-track{animation:none;}}
  .combo-b{font-size:14px;line-height:1.7;color:var(--tx2);}
  .combo-f{margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);font-size:13px;line-height:1.6;color:var(--tx);}
  .dcard-flag{border-color:#7f1d1d;}
  .dflag{font-size:12.5px;font-weight:600;color:#fca5a5;background:rgba(220,38,38,.12);border-radius:10px;padding:8px 10px;margin-bottom:12px;}
  .banner{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.7;}
  .banner-caution{background:var(--card2);color:var(--tx);border:.5px solid var(--line2);}
  .banner-urgent{background:rgba(220,38,38,.14);color:#fca5a5;border:.5px solid rgba(220,38,38,.4);}
  .dcard-caution{border-left:3px solid #fff;}
  .dcard-urgent{border-left:3px solid #dc2626;background:rgba(220,38,38,.06);}
  .dtest{margin-top:12px;padding-top:11px;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:3px;}
  .dtest-k{font-size:11.5px;color:var(--tx3);}
  .dtest-v{font-size:13px;color:var(--tx2);line-height:1.5;}
  .rwarn{margin-top:8px;font-size:12px;color:#fca5a5;}
</style>

<body>
<div class="phone">

  <div class="prog" id="prog" style="display:none;">
    <div class="prog-row"><span id="progLabel">SCAN 1</span><b id="progPct">0%</b></div>
    <div class="bar"><i id="progFill"></i></div>
  </div>

  <section class="screen active intro pad" id="s-intro">
    <a class="intro-top" href="https://instagram.com/morning_rout" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span>모닝루틴 · 금선생</span>
    </a>
    <div class="intro-mid">
      <h1>1분,<br>집에서 하는<br>체형 분석 테스트</h1>
      <p>불편한 곳을 고르면, 몇 가지 자가 체크로<br>지금 내 몸의 패턴을 짚어드려요.</p>
      <div class="intro-badges"><span>물리치료사 설계</span><span>표준 검사 기반</span></div>
      <div class="intro-note">통증이 심하거나 다친 직후라면 검사를 미뤄주세요.</div>

    <div class="rv-wrap"><div class="rv-track" id="rvTrack"></div></div>
    <button class="btn-full" onclick="startScan()">스캔 시작하기</button>

  </section>

  <section class="screen pad" id="s-quiz">
    <div id="quizArea" style="flex:1;display:flex;flex-direction:column;"></div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="prevStep()">이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">다음</button>
    </div>
  </section>

  <section class="screen pad" id="s-safety">
    <div id="safetyArea" style="flex:1;display:flex;flex-direction:column;"></div>
    <div class="nav"><button class="btn btn-primary" style="flex:1;" onclick="goSafetyNext()">확인 완료</button></div>
  </section>

  <section class="screen load pad" id="s-load">
    <div class="spin"></div>
    <h3>결과를 분석하고 있어요</h3>
    <p>잠시만 기다려주세요</p>
  </section>

  <section class="screen r-scroll pad" id="s-result"></section>

  <div class="feedback" id="fbStrip" style="display:none;">
    <b>테스트 버전이에요.</b> 써보시고 어색한 문구·흐름·디자인 있으면 편하게 알려주세요 🙏
  </div>

<script>
/* ================= 부위 ================= */
/* DM 링크: 배포 시 아래 핸들만 바꾸면 전체 버튼에 적용됩니다 */
const IG_HANDLE='morning_rout';
const DM_URL='https://ig.me/m/'+IG_HANDLE;
/* 카카오톡 채널 주소: 채널 개설 후 아래 주소만 바꿔 넣으면 버튼이 살아납니다.
   (카카오톡 채널 관리자센터 → 채널 만들기 → 채널 홈 URL 복사) */
const KAKAO_URL='';
function goDM(){ window.open(DM_URL,'_blank'); }
function goKakao(){ if(KAKAO_URL) window.open(KAKAO_URL,'_blank'); else goDM(); }

/* 후기: 실제로 받은 후기만 여기에 추가하세요. 지어낸 후기는 넣지 않습니다. */
const REVIEWS=[];
function renderReviews(){
  const track=document.getElementById('rvTrack');
  if(!track)return;
  if(!REVIEWS.length){ const w=track.parentElement; if(w) w.style.display='none'; return; }
  const one=REVIEWS.map(r=>`<div class="rv"><span class="st">${'★'.repeat(r.star||5)}</span><b>${r.text}</b>${r.who||''}</div>`).join('');
  track.innerHTML=one+one;   /* 끊김 없이 흐르도록 두 번 반복 */
}

/* 결과 저장: 이 기기에만 저장돼요(서버로 보내지 않음) */
const SAVE_KEY='mr_last_result';
function saveResult(tags){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({t:tags,d:Date.now()})); }catch(e){}
}
function loadSaved(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ return null; }
}
function openSaved(){
  const v=loadSaved(); if(!v||!v.t||!v.t.length)return;
  answers={}; escalate=false;
  v.t.forEach((t,i)=>{ answers['saved_'+i+'_tag']=t; });
  renderResult();
}
const PARTS=[
  {id:'neck',label:'목'},{id:'shoulder',label:'어깨'},{id:'back',label:'등 · 허리'},{id:'pelvis',label:'골반 · 고관절'},
  {id:'knee',label:'무릎'},{id:'wrist',label:'손목 · 팔꿈치'},{id:'ankle',label:'발목 · 발'},
];

/* ================= 문진 ================= */
const DIFF={
  neck:[
    {q:'팔이나 손으로 저림이 내려가나요?',sub:'신경 흐름과 관련된 부분을 먼저 확인할게요.',
     opts:[{t:'네, 특정 손가락까지 저려요',tag:'neck_nerve'},{t:'아니요',tag:''},{t:'잘 모르겠어요',tag:'unsure'}]},
    {q:'벽에 등을 대고 섰을 때, 뒤통수가 벽에 자연스럽게 닿나요?',sub:'발뒤꿈치는 벽에서 한 뼘 정도 떨어뜨리고, 엉덩이와 등을 벽에 대주세요. 턱은 들지 말고 정면을 편하게 봐주세요.',

function findCombos(tags){
  /* 부위를 넘는 연결(cross)을 먼저, 그다음 부위 안 연결. 태그가 겹치지 않게 최대 2장. */
  const picked=[],used=new Set();
  const take=list=>list.forEach(c=>{
    if(picked.length>=2)return;
    if(c.must && !c.must.every(t=>tags.includes(t)))return;   /* 반드시 있어야 하는 태그 */
    const hit=c.tags.filter(t=>tags.includes(t));
    if(hit.length<c.min)return;
    if(hit.some(t=>used.has(t)))return;
    hit.forEach(t=>used.add(t));
    picked.push(c);
  });
  take(COMBOS.filter(c=>c.cross));
  take(COMBOS.filter(c=>!c.cross));
  return picked;
}

/* 큰 제목 규칙
   ① 부위를 넘는 연결이 있으면 그 문장  ② 두 부위를 골랐으면 두 곳을 함께 말하는 문장
   ③ 한 부위면 그 부위의 연결 문장      ④ 연결이 없으면 개수 */
function josa(w){                      /* 받침이 있으면 '과', 없으면 '와' */
  const last=w.charCodeAt(w.length-1);
  if(last<0xAC00||last>0xD7A3) return w+'와';
  return w + ((last-0xAC00)%28 ? '과' : '와');
}
function resultHeadline(pats,combos){
  const cross=combos.find(c=>c.cross);
  if(cross) return cross.title;
  const labels=selectedParts.map(partLabel).filter(Boolean);
  if(labels.length>=2) return `${josa(labels[0])} ${labels[1]}, 두 곳이 함께 보여요`;
  if(combos.length) return combos[0].title;
  return `${pats.length}가지 패턴이 보여요`;
}

/* ================= 마커 분산 로직 =================
   동일/인접 좌표(최소 간격 MIN_DIST 미만) 발생 시 순차 오프셋 적용
   1st: 기본 / 2nd: (+4,-2) / 3rd: (-4,+2) / 4th: (+4,+2) / 5th: (-4,-2) … 반복 */
const MIN_DIST=8;
const OFFSETS=[[0,0],[4,-2],[-4,2],[4,2],[-4,-2],[0,-5],[0,5],[8,0],[-8,0]];
function resolvePositions(list){
  const placed=[];
  return list.map(p=>{
    let best=null;
    for(let i=0;i<OFFSETS.length;i++){
      const nx=p.x+OFFSETS[i][0],ny=p.y+OFFSETS[i][1];
      const ok=placed.every(q=>Math.hypot(q.x-nx,q.y-ny)>=MIN_DIST);
      if(ok){best={x:nx,y:ny};break;}
      if(i===OFFSETS.length-1)best={x:nx,y:ny};
    }
    placed.push(best);
    return {...p,px:best.x,py:best.y};
  });
}

  const box=v.parentElement; v.remove();
  box.classList.remove('has-video');
  if(!box.querySelector('.soon')) box.insertAdjacentHTML('beforeend','<div class="soon">영상 준비 중</div>');
}

/* ================= 해부학적 자세 인체 SVG =================
   Anatomical position: 정면, 팔 몸통에서 약간 벌림, 손바닥 앞.

}
/* 인체도 이미지 경로 — images/front.png, images/back.png 를 넣으면 자동 사용.
   파일이 없으면 아래 SVG 실루엣으로 자동 폴백. 흑백 톤은 .bm-img 필터로 처리. */
const BODY_IMG={front:'images/front.png', back:'images/back.png'};
function figureImg(view, svgFallback){
  const src=BODY_IMG[view];
  return `<div class="bm-imgwrap">
    <img class="bm-img" src="${src}" alt=""
      onerror="this.parentElement.outerHTML=this.getAttribute('data-fb');"
      data-fb='${svgFallback.replace(/'/g,"&#39;")}'>
  </div>`;
}
function figureFront(){
  const svg=`<svg class="bm-fig" viewBox="0 0 200 420">${bodyBase()}
  <!-- hands, palms forward -->
  <path d="M32,236 L48,238 L50,256 Q42,262 30,256 Z" fill="${F}" stroke="${S}" stroke-width="1.2"/>
  <path d="M168,236 L152,238 L150,256 Q158,262 170,256 Z" fill="${F}" stroke="${S}" stroke-width="1.2"/>
  <!-- subtle anatomical lines -->
  <path d="M100,68 L100,118" stroke="${S}" stroke-width=".8" opacity=".6"/>
  <path d="M78,84 Q100,96 122,84" stroke="${S}" stroke-width=".8" fill="none" opacity=".6"/>
  <path d="M88,120 Q100,124 112,120" stroke="${S}" stroke-width=".8" fill="none" opacity=".5"/>
  <circle cx="100" cy="176" r="1.6" fill="${S}" opacity=".7"/>

  <path d="M120,300 Q122,306 120,312" stroke="${S}" stroke-width=".8" fill="none" opacity=".5"/>
  </svg>`;
  return figureImg('front', svg);
}
function figureBack(){
  const svg=`<svg class="bm-fig" viewBox="0 0 200 420">${bodyBase()}
  <!-- hands (back) -->
  <path d="M32,236 L48,238 L50,256 Q42,262 30,256 Z" fill="${F}" stroke="${S}" stroke-width="1.2"/>
  <path d="M168,236 L152,238 L150,256 Q158,262 170,256 Z" fill="${F}" stroke="${S}" stroke-width="1.2"/>
  <!-- spine -->
  <path d="M100,64 L100,214" stroke="${S}" stroke-width="1.2" opacity=".8" stroke-dasharray="2 3"/>
  <!-- scapulae -->
  <path d="M72,84 Q64,104 78,122 Q92,112 88,88 Z" stroke="${S}" stroke-width=".9" fill="none" opacity=".7"/>
  <path d="M128,84 Q136,104 122,122 Q108,112 112,88 Z" stroke="${S}" stroke-width=".9" fill="none" opacity=".7"/>
  <!-- pelvis / gluteal fold -->
  <path d="M76,240 Q100,236 124,240" stroke="${S}" stroke-width=".9" fill="none" opacity=".6"/>
  <path d="M100,224 L100,250" stroke="${S}" stroke-width=".8" opacity=".6"/>
  <path d="M80,304 Q78,310 80,318" stroke="${S}" stroke-width=".8" fill="none" opacity=".5"/>
  <path d="M120,304 Q122,310 120,318" stroke="${S}" stroke-width=".8" fill="none" opacity=".5"/>
  </svg>`;
  return figureImg('back', svg);
}
